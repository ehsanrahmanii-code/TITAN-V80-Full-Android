name: Build TITAN V80 Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract FULL engine ZIP (strict)
        run: |
          set -e
          mkdir -p app/src/main/python

          # Remove any incomplete/stub titan package left in the repo
          rm -rf app/src/main/python/titan
          echo "Cleaned old titan/ stubs"

          if [ ! -f titan-v80-python-engine.zip ]; then
            echo "ERROR: titan-v80-python-engine.zip not found in repo root"
            ls -la
            exit 1
          fi

          echo "Found titan-v80-python-engine.zip ($(du -h titan-v80-python-engine.zip | cut -f1))"
          unzip -o titan-v80-python-engine.zip -d /tmp/engine

          echo "=== ZIP contents (top) ==="
          find /tmp/engine -maxdepth 3 -type d
          find /tmp/engine -name "runtime.py" -exec ls -l {} \;

          if [ -d /tmp/engine/python/titan ]; then
            cp -a /tmp/engine/python/. app/src/main/python/
            echo "Extracted: python/ structure"
          elif [ -d /tmp/engine/titan ]; then
            cp -a /tmp/engine/titan app/src/main/python/
            echo "Extracted: top-level titan/ structure"
          else
            echo "ERROR: Unknown ZIP structure"
            find /tmp/engine -maxdepth 4
            exit 1
          fi

          # Keep the bootstrap that lives in the repo (it has Android patches + fallback)
          # It was not inside the engine ZIP, so it stays from checkout.

          echo "=== After extract ==="
          ls -la app/src/main/python/
          ls -la app/src/main/python/titan/ || true
          ls -la app/src/main/python/titan/runtime.py || true
          find app/src/main/python -name "*.py" | wc -l

      - name: STRICT Verify full engine (fail if incomplete)
        run: |
          set -e

          test -f app/src/main/python/titan_bootstrap.py || { echo "Missing titan_bootstrap.py"; exit 1; }

          RUNTIME="app/src/main/python/titan/runtime.py"
          test -f "$RUNTIME" || { echo "Missing $RUNTIME"; exit 1; }

          SIZE=$(stat -c%s "$RUNTIME")
          echo "runtime.py size = $SIZE bytes"
          if [ "$SIZE" -lt 2000 ]; then
            echo "ERROR: runtime.py is too small ($SIZE bytes). Engine ZIP was not extracted correctly."
            echo "File content:"
            cat "$RUNTIME" || true
            exit 1
          fi

          test -d app/src/main/python/titan/layers || { echo "Missing titan/layers"; exit 1; }

          COUNT=$(find app/src/main/python -name "*.py" | wc -l)
          echo "Total .py files = $COUNT"
          if [ "$COUNT" -lt 80 ]; then
            echo "ERROR: Only $COUNT .py files found (need >= 80). Engine is incomplete."
            find app/src/main/python -name "*.py" | head -50
            exit 1
          fi

          echo "Engine OK: runtime.py=${SIZE}B, py_files=${COUNT}"
          ls app/src/main/python/titan/layers/

      - name: Set up Python 3.11 (required by Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          set -e
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "sdk.dir=$SDK_ROOT" > local.properties

      - name: Gradle wrapper
        run: |
          set -e
          mkdir -p gradle/wrapper
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          curl -fsSL -o gradlew https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradlew
          chmod +x gradlew
          printf '%s\n' \
            'distributionBase=GRADLE_USER_HOME' \
            'distributionPath=wrapper/dists' \
            'distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip' \
            'networkTimeout=120000' \
            'validateDistributionUrl=true' \
            'zipStoreBase=GRADLE_USER_HOME' \
            'zipStorePath=wrapper/dists' \
            > gradle/wrapper/gradle-wrapper.properties

      - name: Build Debug APK
        env:
          GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false
        run: |
          python3 --version
          which python3
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Name APK
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "app/build/outputs/apk/debug/TITAN-V80.apk"
          ls -lh "app/build/outputs/apk/debug/TITAN-V80.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TITAN-V80-Android-APK
          path: app/build/outputs/apk/debug/TITAN-V80.apk
          if-no-files-found: error
