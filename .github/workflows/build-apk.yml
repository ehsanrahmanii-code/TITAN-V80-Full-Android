name: Build TITAN V80 Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract engine ZIP if present (phone upload)
        run: |
          set -e
          mkdir -p app/src/main/python

          if [ -f titan-v80-python-engine.zip ]; then
            echo "Found titan-v80-python-engine.zip"
            unzip -o titan-v80-python-engine.zip -d .
          elif [ -f TITAN-V80-Full-Android-complete.zip ]; then
            echo "Found TITAN-V80-Full-Android-complete.zip"
            unzip -o TITAN-V80-Full-Android-complete.zip -d /tmp/fullproj
            if [ -d /tmp/fullproj/app/src/main/python ]; then
              cp -a /tmp/fullproj/app/src/main/python/. app/src/main/python/
            elif [ -d /tmp/fullproj/python ]; then
              cp -a /tmp/fullproj/python/. app/src/main/python/
            fi
          elif [ -f engine.zip ]; then
            echo "Found engine.zip"
            unzip -o engine.zip -d app/src/main/
          fi

          if [ -d python ] && [ ! -f app/src/main/python/titan_bootstrap.py ]; then
            cp -a python/. app/src/main/python/
          fi

          echo "=== Python files after extract ==="
          find app/src/main/python -name "*.py" 2>/dev/null | wc -l || true
          ls -la app/src/main/python/ 2>/dev/null || true

      - name: Verify Python engine package
        run: |
          set -e
          test -f app/src/main/python/titan_bootstrap.py
          test -f app/src/main/python/titan/runtime.py
          test -d app/src/main/python/titan/layers
          echo "Python files:"
          find app/src/main/python -name "*.py" | wc -l
          ls app/src/main/python/titan/layers/

      - name: Set up Python 3.11 (required by Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          set -e
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "sdk.dir=$SDK_ROOT" > local.properties

      - name: Gradle wrapper
        run: |
          set -e
          mkdir -p gradle/wrapper
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          curl -fsSL -o gradlew https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradlew
          chmod +x gradlew
          printf '%s\n' \
            'distributionBase=GRADLE_USER_HOME' \
            'distributionPath=wrapper/dists' \
            'distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip' \
            'networkTimeout=120000' \
            'validateDistributionUrl=true' \
            'zipStoreBase=GRADLE_USER_HOME' \
            'zipStorePath=wrapper/dists' \
            > gradle/wrapper/gradle-wrapper.properties

      - name: Build Debug APK
        env:
          GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false
        run: |
          python3 --version
          which python3
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Name APK
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "app/build/outputs/apk/debug/TITAN-V80.apk"
          ls -lh "app/build/outputs/apk/debug/TITAN-V80.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TITAN-V80-Android-APK
          path: app/build/outputs/apk/debug/TITAN-V80.apk
          if-no-files-found: error
