name: Build TITAN V80 Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract FULL engine ZIP (strict)
        run: |
          set -e
          mkdir -p app/src/main/python

          rm -rf app/src/main/python/titan
          echo "Cleaned old titan/ stubs"

          if [ ! -f titan-v80-python-engine.zip ]; then
            echo "ERROR: titan-v80-python-engine.zip not found"
            ls -la
            exit 1
          fi

          echo "Found titan-v80-python-engine.zip ($(du -h titan-v80-python-engine.zip | cut -f1))"
          unzip -o titan-v80-python-engine.zip -d /tmp/engine

          if [ -d /tmp/engine/python/titan ]; then
            cp -a /tmp/engine/python/. app/src/main/python/
            echo "Extracted: python/ structure"
          elif [ -d /tmp/engine/titan ]; then
            cp -a /tmp/engine/titan app/src/main/python/
            echo "Extracted: top-level titan/ structure"
          else
            echo "ERROR: Unknown ZIP structure"
            find /tmp/engine -maxdepth 4
            exit 1
          fi

          echo "=== After extract ==="
          find app/src/main/python -name "*.py" | wc -l
          ls -la app/src/main/python/titan/layers/core/bootstrap_storage.py
          ls app/src/main/python/titan/layers/

      - name: Patch runtime.py for Chaquopy (replace is_file checks)
        run: |
          set -e
          python3 << 'PY'
          from pathlib import Path
          p = Path("app/src/main/python/titan/runtime.py")
          raw = p.read_text(encoding="utf-8")
          old = '''        path = LAYER_DIR / f"{name}.py"
        if not path.is_file():
            raise FileNotFoundError(f"TITAN layer missing: {path}")
        try:
            src = path.read_text(encoding="utf-8")
            code = compile(src, str(path), "exec", flags=_FLAGS, dont_inherit=True)
        except (OSError, SyntaxError) as exc:
            raise RuntimeError(f"Failed to load TITAN layer {name}: {exc}") from exc'''
          new = '''        path = LAYER_DIR / f"{name}.py"
        try:
            src = path.read_text(encoding="utf-8")
        except Exception as exc:
            raise FileNotFoundError(f"TITAN layer missing or unreadable: {path} ({exc})") from exc
        try:
            code = compile(src, str(path), "exec", flags=_FLAGS, dont_inherit=True)
        except SyntaxError as exc:
            raise RuntimeError(f"Failed to load TITAN layer {name}: {exc}") from exc'''
          if old not in raw:
            # try softer match
            if "if not path.is_file()" in raw:
              raw2 = raw.replace(
                  "if not path.is_file():\n            raise FileNotFoundError(f\"TITAN layer missing: {path}\")",
                  "# Chaquopy: skip is_file(); try read instead\n        pass  # is_file unreliable on AssetFinder",
              )
              p.write_text(raw2, encoding="utf-8")
              print("Patched with soft replace")
            else:
              print("WARNING: is_file pattern not found; leaving runtime as-is")
              print(raw[raw.find("LAYER_DIR"):raw.find("LAYER_DIR")+500] if "LAYER_DIR" in raw else "no LAYER_DIR")
          else:
            p.write_text(raw.replace(old, new), encoding="utf-8")
            print("Patched runtime.py for Chaquopy")
          PY

      - name: STRICT Verify full engine
        run: |
          set -e
          test -f app/src/main/python/titan_bootstrap.py
          test -f app/src/main/python/titan/runtime.py
          test -f app/src/main/python/titan/layers/core/bootstrap_storage.py
          test -f app/src/main/python/titan/layers/web/flask_app.py
          test -f app/src/main/python/titan/layers/entry/main_entry.py

          SIZE=$(stat -c%s app/src/main/python/titan/runtime.py)
          BS=$(stat -c%s app/src/main/python/titan/layers/core/bootstrap_storage.py)
          COUNT=$(find app/src/main/python -name "*.py" | wc -l)
          echo "runtime.py=$SIZE  bootstrap_storage.py=$BS  py_count=$COUNT"

          if [ "$SIZE" -lt 2000 ]; then echo "runtime too small"; exit 1; fi
          if [ "$BS" -lt 1000 ]; then echo "bootstrap_storage too small"; exit 1; fi
          if [ "$COUNT" -lt 80 ]; then echo "too few py files: $COUNT"; exit 1; fi

          echo "Engine OK"
          ls app/src/main/python/titan/layers/

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          set -e
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "sdk.dir=$SDK_ROOT" > local.properties

      - name: Gradle wrapper
        run: |
          set -e
          mkdir -p gradle/wrapper
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          curl -fsSL -o gradlew https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradlew
          chmod +x gradlew
          printf '%s\n' \
            'distributionBase=GRADLE_USER_HOME' \
            'distributionPath=wrapper/dists' \
            'distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip' \
            'networkTimeout=120000' \
            'validateDistributionUrl=true' \
            'zipStoreBase=GRADLE_USER_HOME' \
            'zipStorePath=wrapper/dists' \
            > gradle/wrapper/gradle-wrapper.properties

      - name: Build Debug APK
        env:
          GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false
        run: |
          ./gradlew clean assembleDebug --stacktrace --no-daemon

      - name: Name APK
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "app/build/outputs/apk/debug/TITAN-V80.apk"
          ls -lh "app/build/outputs/apk/debug/TITAN-V80.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TITAN-V80-Android-APK
          path: app/build/outputs/apk/debug/TITAN-V80.apk
          if-no-files-found: error
